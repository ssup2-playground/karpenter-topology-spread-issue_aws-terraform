apiVersion: apps/v1
kind: Deployment
metadata:
  name: 2az-app
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: 2az-app
  template:
    metadata:
      labels:
        app: 2az-app
    spec:
      nodeSelector:
        pool: 2az
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        nodeAffinityPolicy: Honor
        labelSelector:
          matchLabels:
            app: 2az-app
      containers:
      - name: app
        image: public.ecr.aws/docker/library/busybox:stable
        command: ["sleep", "infinity"]
        # Large enough that one node fits exactly one pod, so kube-scheduler cannot pack the
        # remaining replicas onto an existing node and mask Karpenter's provisioning failure.
        resources:
          requests:
            cpu: 3
            memory: 1Gi
